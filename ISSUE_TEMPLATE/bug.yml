name: Bug report
description: A site, the admin or a tool is broken or behaves incorrectly.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: URL, page or feature name.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The actual result, with a screenshot or error message. Mask any keys, wallet private keys or personal data in screenshots first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Production site unusable
        - Some features broken
        - Minor, does not block use
    validations:
      required: true
