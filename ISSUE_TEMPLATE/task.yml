name: Task
description: Something to do, written so anyone or any agent can pick it up.
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why it is needed and the current state. Link related issues, PRs and documents.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Work
      description: Concrete steps or scope. List what is out of scope too.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done criteria
      description: What counts as done and how to verify it. For example, a production page returns 200, CI is green, a document is updated.
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due date
      description: Leave empty if none. Also set Target date on the board.
